# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.http_timeout: 30.0

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Transport/'

    App\Service\Searcher\SearcherFactory: ~

    App\Config\ConfigLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Config\AppConfig:
        factory: ['@App\Config\ConfigLoader', 'load']

    App\Service\Searcher\SearcherInterface:
        factory: ['@App\Service\Searcher\SearcherFactory', 'create']
        public: true

    App\Service\Reader\ReaderFactory:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Reader\ReaderInterface:
        factory: ['@App\Service\Reader\ReaderFactory', 'create']
        public: true

    App\Service\BrowserState:
        public: true

    App\Service\SearchService:
        public: true

    App\Service\PageDisplayService:
        public: true
    App\Service\OpenService:
        public: true
        arguments:
            $cache: '@cache.array_adapter'
    App\Service\FindService:
        public: true
        arguments:
            $cache: '@cache.array_adapter'

    # Make ALL services in App\Tools\ public
    App\Tools\:
        resource: '../src/Tools'
        public: true

    App\Service\ServerFactory:
        arguments:
            $sessionDir: '%env(string:APP_VAR_DIR)%/sessions'
        public: true

    App\Command\BrowserMcpCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # PSR-16 cache: wrap a PSR-6 pool (ArrayAdapter) with Psr16Cache and alias to Psr\SimpleCache\CacheInterface
    cache.array_adapter:
        class: Symfony\Component\Cache\Adapter\ArrayAdapter
        arguments:
            $defaultLifetime: 0
            $storeSerialized: true

    Psr\Container\ContainerInterface: '@service_container'
    Psr\Log\LoggerInterface:
        alias: 'logger'
        public: true

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    monolog.formatter.json_with_stacktraces:
        class: Monolog\Formatter\JsonFormatter
        arguments:
            $includeStacktraces: true

    http_client.retry_strategy:
        class: Symfony\Component\HttpClient\Retry\GenericRetryStrategy
        arguments:
            - [423, 425, 429, 500, 502, 503, 504]
            - 200
            - 2.0
            - 2000
            - 0.1

    http_client.retryable:
        class: Symfony\Component\HttpClient\RetryableHttpClient
        decorates: 'http_client'
        arguments:
            - '@http_client.retryable.inner'
            - '@http_client.retry_strategy'
