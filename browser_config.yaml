general:
    transport: http
    host: 0.0.0.0
    port: 9001
    search_cache_ttl_seconds: 600
    open_cache_ttl_seconds: 300

display:
    search_view_tokens: 1024
    search_encoding_name: o200k_base

searchers:
    selected: searxng
    providers:
        searxng:
            url: http://server:8088
        jinaai:
            token: "%env(JINA_SEARCH_TOKEN)%"
        tavily:
            token: "%env(TAVILY_SEARCH_TOKEN)%"
        duckduckgo:
            timeout_seconds: 5
            max_retries: 1
            user_agent: "Mozilla/5.0 (X11; Linux x86_64; rv:148.0) Gecko/20100101 Firefox/148.0"

readers:
    selected: http
    providers:
        http:
            timeout_seconds: 30
            max_retries: 2
            user_agent: "Mozilla/5.0 (X11; Linux x86_64; rv:148.0) Gecko/20100101 Firefox/148.0"
            noise_class_tokens:
                - codeblock-lines
                - linenos
                - line-numbers
                - gutter
        jinaai:
            token: "%env(JINA_READER_TOKEN)%"
            timeout_seconds: 15
            max_retries: 1
        tavily:
            token: "%env(TAVILY_READER_TOKEN)%"
            timeout_seconds: 15
            max_retries: 1
